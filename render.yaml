services:
  - type: web
    name: adshot
    runtime: docker
    plan: starter          # Chromium needs RAM; free (512 MB) will often crash
    healthCheckPath: /healthz
    envVars:
      - key: CONCURRENCY
        value: "3"         # parallel browsers: Starter(512MB)=2, Standard(2GB)=4-5
      - key: MAX_TASKS_PER_JOB
        value: "24"
      - key: PROXY_URL     # optional, e.g. http://user:pass@host:port (Indian IP)
        sync: false
